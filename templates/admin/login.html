<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Painel de Controle Refrigeração Sorocaba</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center">
  <div class="max-w-md w-full bg-white rounded-3xl border p-8 shadow-lg">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-black text-slate-800">PAINEL DO ADMINISTRADOR</h1>
      <p class="text-xs text-slate-500 font-semibold uppercase mt-1 tracking-wider">Edição de Layout & Conteúdo</p>
    </div>

    <!-- Mensagens de Erro/Sucesso -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="mb-4 p-3 rounded-xl text-sm font-bold {% if category == 'danger' %}bg-red-50 text-red-700 border border-red-100{% else %}bg-blue-50 text-blue-700 border border-blue-100{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" class="space-y-4">
      <div>
        <label for="username" class="block text-xs font-bold text-slate-600 uppercase mb-1">Usuário</label>
        <input type="text" id="username" name="username" required placeholder="admin" class="w-full border rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label for="password" class="block text-xs font-bold text-slate-600 uppercase mb-1">Senha</label>
        <input type="password" id="password" name="password" required placeholder="••••••••" class="w-full border rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <button type="submit" class="w-full bg-[#0E4FCB] text-white font-bold py-3.5 rounded-xl hover:bg-blue-700 transition">
        Entrar no Painel
      </button>
    </form>

    <div class="text-center mt-6">
      <a href="/" class="text-xs text-slate-400 hover:text-slate-600 hover:underline">← Voltar para o Site</a>
    </div>
  </div>
</body>
</html>
