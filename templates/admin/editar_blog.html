<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if post %}Editar Post: {{ post.title }}{% else %}Nova Postagem{% endif %} - Painel Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <div class="max-w-4xl mx-auto px-4 py-8">
    <div class="mb-6">
      <a href="{{ url_for('admin_dashboard') }}" class="text-sm text-[#0E4FCB] font-bold hover:underline">← Voltar para o Painel</a>
      <h1 class="text-2xl font-black text-slate-800 mt-2">
        {% if post %}Editar Artigo de Blog: {{ post.title }}{% else %}Novo Artigo de Blog para SEO Semântico{% endif %}
      </h1>
    </div>

    <form method="POST" class="bg-white border rounded-2xl p-6 shadow-sm space-y-5">
      <div class="grid md:grid-cols-2 gap-4">
        <div>
          <label for="title" class="block text-xs font-bold text-slate-600 uppercase mb-1">Título do Artigo</label>
          <input type="text" id="title" name="title" value="{{ post.title if post else '' }}" required placeholder="Ex: Por que a geladeira quebra no calor?" class="w-full border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label for="slug" class="block text-xs font-bold text-slate-600 uppercase mb-1">Slug (URL amigável)</label>
          <input type="text" id="slug" name="slug" value="{{ post.slug if post else '' }}" required placeholder="Ex: geladeira-quebra-no-calor" class="w-full border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <div class="grid md:grid-cols-2 gap-4">
        <div>
          <label for="meta_description" class="block text-xs font-bold text-slate-600 uppercase mb-1">Meta Description (SEO)</label>
          <input type="text" id="meta_description" name="meta_description" value="{{ post.meta_description if post else '' }}" required placeholder="Ex: Dicas valiosas para..." class="w-full border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label for="created_at" class="block text-xs font-bold text-slate-600 uppercase mb-1">Data de Exibição</label>
          <input type="text" id="created_at" name="created_at" value="{{ post.created_at if post else '12 de Julho de 2026' }}" required placeholder="Ex: 12 de Julho de 2026" class="w-full border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <div>
        <label for="summary" class="block text-xs font-bold text-slate-600 uppercase mb-1">Resumo (Aparece na listagem do Blog)</label>
        <textarea id="summary" name="summary" rows="2" required placeholder="Ex: Resumo curto para atrair o clique do leitor..." class="w-full border rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">{{ post.summary if post else '' }}</textarea>
      </div>

      <div>
        <label for="content" class="block text-xs font-bold text-slate-600 uppercase mb-1">Conteúdo Completo do Artigo (SEO Semântico)</label>
        <textarea id="content" name="content" rows="10" required placeholder="Escreva o artigo completo aqui com dicas práticas e geolocalização..." class="w-full border rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 leading-relaxed">{{ post.content if post else '' }}</textarea>
      </div>

      <div class="pt-4 border-t flex gap-3">
        <button type="submit" class="bg-[#0E4FCB] hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-xl shadow-md">
          Publicar Artigo
        </button>
        <a href="{{ url_for('admin_dashboard') }}" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold px-6 py-3 rounded-xl text-center">
          Cancelar
        </a>
      </div>
    </form>
  </div>
</body>
</html>
